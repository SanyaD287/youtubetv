<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV YouTube Client</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-box {
            display: flex;
            gap: 15px;
            width: 60%;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            background: #121212;
            border: 2px solid #303030;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3ea6ff;
            background: #222;
        }

        button {
            padding: 0 30px;
            font-size: 16px;
            font-weight: bold;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:focus, button:hover {
            background: #cc0000;
            outline: 2px solid #fff;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            flex: 1;
            overflow: hidden;
        }

        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .sidebar-history {
            background: #121212;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 2px solid #222;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #aaa;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .clear-btn:focus, .clear-btn:hover {
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            outline: 1px solid #ff0000;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: #212121;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:focus, .history-item:hover {
            border-color: #3ea6ff;
            background: #272727;
            outline: none;
        }

        .placeholder {
            color: #666;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">▶ YouTube TV</div>
        <div class="input-box">
            <input type="text" id="url-input" placeholder="Встав посилання на відео...">
            <button id="play-btn" onclick="playVideo()">Відтворити</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="player-wrapper" id="player-screen">
            <div class="placeholder" id="placeholder-text">Оберіть або вставте посилання для перегляду</div>
            <div id="player"></div>
        </div>

        <div class="sidebar-history">
            <div class="sidebar-header">
                <div class="sidebar-title">Історія</div>
                <button class="clear-btn" id="clear-history-btn" onclick="clearHistory()">Очистити</button>
            </div>
            <div class="history-list" id="history-list">
                <div style="color: #555; text-align: center; margin-top: 20px;">Історія порожня</div>
            </div>
        </div>
    </div>

<!-- Підключаємо офіційний YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let history = JSON.parse(localStorage.getItem('tv_history') || '[]');
    let ytPlayer = null;
    let currentVideoId = null;

    function extractVideoId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    // Ініціалізація YouTube API плеєра
    function onYouTubeIframeAPIReady() {
        // Плеєр створиться автоматично при першому запуску
    }

    function playVideo(customUrl) {
        const urlInput = document.getElementById('url-input');
        const targetUrl = customUrl || urlInput.value.trim();
        const videoId = extractVideoId(targetUrl);
        const placeholder = document.getElementById('placeholder-text');

        if (!videoId) {
            if (!customUrl) alert('Некоректне посилання!');
            return;
        }

        if (placeholder) {
            placeholder.style.display = 'none';
        }

        currentVideoId = videoId;

        if (!ytPlayer) {
            ytPlayer = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        } else {
            ytPlayer.loadVideoById(videoId);
        }

        // Оновлюємо історію без дублікатів
        history = history.filter(item => item !== targetUrl);
        history.unshift(targetUrl);
        if (history.length > 10) history.pop();
        
        localStorage.setItem('tv_history', JSON.stringify(history));
        renderHistory();
        
        if (!customUrl) urlInput.value = '';
    }

    // Автоматичне відтворення наступного відео, коли поточне закінчується (стан 0)
    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playNextInHistory();
        }
    }

    function playNextInHistory() {
        if (history.length <= 1) return;
        // Шукаємо індекс поточного відео в історії, щоб запустити наступне
        const currentIndex = history.findIndex(item => extractVideoId(item) === currentVideoId);
        if (currentIndex !== -1 && currentIndex + 1 < history.length) {
            playVideo(history[currentIndex + 1]);
        } else {
            // Якщо дійшли до кінця, можна почати з початку історії
            playVideo(history[0]);
        }
    }

    function clearHistory() {
        history = [];
        localStorage.removeItem('tv_history');
        renderHistory();
    }

    function renderHistory() {
        const listEl = document.getElementById('history-list');
        if (history.length === 0) {
            listEl.innerHTML = '<div style="color: #555; text-align: center; margin-top: 20px;">Історія порожня</div>';
            return;
        }

        listEl.innerHTML = '';
        history.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.tabIndex = 0;
            div.textContent = item;
            div.onclick = () => playVideo(item);
            div.onkeypress = (e) => { if (e.key === 'Enter') playVideo(item); };
            listEl.appendChild(div);
        });
    }

    document.getElementById('url-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            playVideo();
        }
    });

    renderHistory();

    // ==========================================
    // КЕРУВАННЯ ПУЛЬТОМ (СТРІЛКИ НАВІГАЦІЇ)
    // ==========================================
    const focusableElements = [
        () => document.getElementById('url-input'),
        () => document.getElementById('play-btn'),
        () => document.getElementById('clear-history-btn'),
        () => document.querySelectorAll('.history-item')
    ];

    document.addEventListener('keydown', function(e) {
        const activeEl = document.activeElement;
        
        // Кнопка Backspace / Back на пультi повертає фокус у поле введення
        if (e.key === 'Backspace' && activeEl.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('url-input').focus();
            return;
        }

        // Проста навігація стрілками по вертикалі між історією та елементами керування
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            const historyItems = Array.from(document.querySelectorAll('.history-item'));
            const allFocusable = [
                document.getElementById('url-input'),
                document.getElementById('play-btn'),
                document.getElementById('clear-history-btn'),
                ...historyItems
            ];

            const currentIndex = allFocusable.indexOf(activeEl);
            if (currentIndex !== -1) {
                e.preventDefault();
                let nextIndex = e.key === 'ArrowDown' ? currentIndex + 1 : currentIndex - 1;
                if (nextIndex >= 0 && nextIndex < allFocusable.length) {
                    allFocusable[nextIndex].focus();
                }
            } else if (historyItems.length > 0 && activeEl.tagName !== 'INPUT') {
                historyItems[0].focus();
            }
        }
    });
</script>

</body>
</html>
