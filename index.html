<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стабільний YouTube Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            outline: none;
        }
        input:focus {
            border-color: #ff0000;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Тест відеоплеєра</h2>
        <div class="controls">
            <input type="text" id="videoUrl" placeholder="Вставте посилання на YouTube...">
            <button onclick="loadVideo()">Дивитися</button>
        </div>
        
        <div class="video-container">
            <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('videoUrl').focus();
        };

        function extractVideoId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideo() {
            let urlInput = document.getElementById('videoUrl').value;
            let videoId = extractVideoId(urlInput);
            
            if (videoId) {
                let iframe = document.getElementById('youtubePlayer');
                // Використовуємо офіційний захищений домен без трекерів
                iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
            } else {
                alert('Будь ласка, введіть коректне посилання на YouTube!');
            }
        }
    </script>

</body>
</html>
