<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Власний HTML5 Плеєр</title>
    <!-- Підключаємо стилі кастомного плеєра Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            outline: none;
        }
        input:focus {
            border-color: #ff0000;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        .video-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #status {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Власний плеєр (без елементів YouTube)</h2>
        <div class="controls">
            <input type="text" id="videoUrl" placeholder="Вставте посилання на YouTube...">
            <button onclick="playCustomVideo()">Запустити</button>
        </div>
        
        <div class="video-wrapper">
            <!-- Стандартний HTML5-плеєр -->
            <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="900" height="506"></video>
        </div>
        <div id="status"></div>
    </div>

    <!-- Скрипт плеєра Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let player = videojs('my-video');

        function extractVideoId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function playCustomVideo() {
            let urlInput = document.getElementById('videoUrl').value;
            let videoId = extractVideoId(urlInput);
            let status = document.getElementById('status');

            if (!videoId) {
                alert('Некоректне посилання!');
                return;
            }

            status.innerText = "Отримання прямого відеопотоку...";

            try {
                // Запитуємо пряме посилання на відео через відкрите API Cobalt/Piped
                let response = await fetch(`https://api.piped.video/streams/${videoId}`);
                let data = await response.json();

                // Знаходимо найкраще пряме відеоджерело (формат mp4 або hls)
                if (data.hls) {
                    player.src({
                        src: data.hls,
                        type: 'application/x-mpegURL'
                    });
                    player.play();
                    status.innerText = "Відтворення через власний плеєр";
                } else if (data.videoStreams && data.videoStreams.length > 0) {
                    // Якщо HLS немає, беремо прямий MP4
                    let stream = data.videoStreams.find(s => s.mimeType.includes('mp4')) || data.videoStreams[0];
                    player.src({
                        src: stream.url,
                        type: stream.mimeType
                    });
                    player.play();
                    status.innerText = "Відтворення через власний плеєр";
                } else {
                    status.innerText = "Помилка: Не вдалося витягти відеопотік.";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Помилка завантаження даних із сервера API.";
            }
        }
    </script>

</body>
</html>
